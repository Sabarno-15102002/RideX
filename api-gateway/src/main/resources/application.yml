server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:

        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**

        - id: rider-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/riders/**

        - id: driver-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/drivers/**

        - id: location-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/location/**
            
        - id: trip-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/v1/trips/**

        - id: matching-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/v1/matching/**

        - id: pricing-service
          uri: http://localhost:8087
          predicates:
            - Path=/api/v1/pricing/**

        - id: payment-service
          uri: http://localhost:8088
          predicates:
            - Path=/api/v1/payments/**

  security:
    oauth2:
      resourceserver:
        jwt:
          secret-key: ${JWT_SECRET:change-this-secret-key-to-a-long-random-value}
