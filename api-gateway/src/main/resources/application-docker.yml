spring:
    cloud:
        gateway:
            routes:
                - id: auth-service
                  uri: http://auth-service:8081
                  predicates:
                      - Path=/api/v1/auth/**

                - id: rider-service
                  uri: http://rider-service:8082
                  predicates:
                      - Path=/api/v1/riders/**

                - id: driver-service
                  uri: http://driver-service:8083
                  predicates:
                      - Path=/api/v1/drivers/**

                - id: location-service
                  uri: http://location-service:8084
                  predicates:
                      - Path=/api/v1/location/**

                - id: trip-service
                  uri: http://trip-service:8085
                  predicates:
                      - Path=/api/v1/trips/**

                - id: matching-service
                  uri: http://matching-service:8086
                  predicates:
                      - Path=/api/v1/matching/**

                - id: pricing-service
                  uri: http://pricing-service:8087
                  predicates:
                      - Path=/api/v1/pricing/**

                - id: payment-service
                  uri: http://payment-service:8088
                  predicates:
                      - Path=/api/v1/payments/**
