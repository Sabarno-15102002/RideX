spring:
  application:
    name: matching-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/matching_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    consumer:
      group-id: matching-service
      auto-offset-reset: earliest
      enable-auto-commit: false

      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

      properties:
        spring.json.trusted.packages: "com.ridex.matching.event"
    listener:
      observation-enabled: true
    template:
      observation-enabled: true

server:
  port: ${SERVER_PORT:8086}

management:
  endpoints:
    web:
      exposure:
        include: "*"
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://tempo:4318/v1/traces
  otlp:
    metrics:
      export:
        enabled: false

jwt:
  secret: ${JWT_SECRET:change-this-secret-key-to-a-long-random-value}
  expiration-ms: ${JWT_EXPIRATION_MS:900000}

ridex:
  services:
    location:
      base-url: ${LOCATION_SERVICE_URL:http://localhost:8084}
    driver:
      base-url: ${DRIVER_SERVICE_URL:http://localhost:8083}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [correlationId=%X{correlationId}] %logger{36} - %msg%n"
