services:

  api-gateway:
    build: ./api-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker

  auth-service:
    build: ./auth-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      auth-db:
        condition: service_healthy
      kafka:
        condition: service_started
    ports:
      - "8081:8081"

  rider-service:
    build: ./rider-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      rider-db:
        condition: service_healthy
      kafka:
        condition: service_started
    ports:
      - "8082:8082"

  driver-service:
    build: ./driver-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      driver-db:
        condition: service_healthy
      kafka:
        condition: service_started
    ports:
      - "8083:8083"

  location-service:
    build: ./location-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      kafka:
        condition: service_started
      redis:
        condition: service_started
    ports:
      - "8084:8084"

  trip-service:
    build: ./trip-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      trip-db:
        condition: service_healthy
      kafka:
        condition: service_started
    ports:
      - "8085:8085"    

  matching-service:
    build: ./matching-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      matching-db:
        condition: service_healthy
      kafka:
        condition: service_started
      location-service:
        condition: service_started
      driver-service:
        condition: service_started
    ports:
      - "8086:8086"

  pricing-service:
    build: ./pricing-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      pricing-db:
        condition: service_healthy
      kafka:
        condition: service_started
    ports:
      - "8087:8087"

  payment-service:
    build: ./payment-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      payment-db:
        condition: service_healthy
      kafka:
        condition: service_started
    ports:
      - "8088:8088"

  # =========================
  # Auth PostgreSQL
  # =========================

  auth-db:
    image: postgres:16
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USERNAME:-postgres} -d auth_db"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
  
  # =========================
  # Rider PostgreSQL
  # =========================
  rider-db:
    image: postgres:16
    environment:
      POSTGRES_DB: rider_db
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - rider_db_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USERNAME:-postgres} -d rider_db"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  # =========================
  # Driver PostgreSQL
  # =========================
  driver-db:
    image: postgres:16
    environment:
      POSTGRES_DB: driver_db
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - driver_db_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USERNAME:-postgres} -d driver_db"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  # =========================
  # Trip PostgreSQL
  # =========================
  trip-db:
    image: postgres:16
    environment:
      POSTGRES_DB: trip_db
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - trip_db_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USERNAME:-postgres} -d trip_db"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  # =========================
  # Matching PostgreSQL
  # =========================
  matching-db:
    image: postgres:16
    environment:
      POSTGRES_DB: matching_db
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - matching_db_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USERNAME:-postgres} -d matching_db"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  # =========================
  # Pricing PostgreSQL
  # =========================
  pricing-db:
    image: postgres:16
    environment:
      POSTGRES_DB: pricing_db
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - pricing_db_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USERNAME:-postgres} -d pricing_db"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  # =========================
  # Payment PostgreSQL
  # =========================
  payment-db:
    image: postgres:16
    environment:
      POSTGRES_DB: payment_db
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - payment_db_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USERNAME:-postgres} -d payment_db"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  # =========================
  # Kafka
  # =========================

  kafka:
    image: apache/kafka:4.0.1
    container_name: ridex-kafka

    ports:
      - "29092:29092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

    volumes:
      - kafka_data:/var/lib/kafka/data

  # =========================
  # Redis
  # =========================

  redis:
    image: redis:7.4
    container_name: ridex-redis

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data


volumes:
  auth_db_data:
  rider_db_data:
  driver_db_data:
  trip_db_data:
  matching_db_data:
  pricing_db_data:
  payment_db_data:
  kafka_data:
  redis_data: