spring:
    application:
        name: trip-service

    datasource:
        url: ${DB_URL:jdbc:postgresql://localhost:5432/trip_db}
        username: ${DB_USERNAME:postgres}
        password: ${DB_PASSWORD:postgres}

    jpa:
        hibernate:
            ddl-auto: validate
        open-in-view: false

    flyway:
        enabled: true

    kafka:
        bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

        consumer:
            group-id: trip-service
            auto-offset-reset: earliest
            enable-auto-commit: false

            key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
            value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

            properties:
                spring.json.trusted.packages: "com.ridex.trip.event"
        listener:
            observation-enabled: true
        template:
            observation-enabled: true

jwt:
    secret: ${JWT_SECRET:change-this-secret-key-to-a-long-random-value}
    expiration-ms: ${JWT_EXPIRATION_MS:900000}

server:
    port: ${TRIP_SERVICE_PORT:8085}

ridex:
    services:
        pricing:
            base-url: http://localhost:8087

management:
    endpoints:
        web:
            exposure:
                include: "*"
    metrics:
        distribution:
            percentiles-histogram:
                http.server.requests: true
    tracing:
        sampling:
            probability: 1.0
    opentelemetry:
        tracing:
            export:
                otlp:
                    endpoint: http://tempo:4318/v1/traces
    otlp:
        metrics:
            export:
                enabled: false

logging:
    pattern:
        console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [correlationId=%X{correlationId}] %logger{36} - %msg%n"
