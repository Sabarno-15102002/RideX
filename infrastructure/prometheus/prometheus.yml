global:
  scrape_interval: 15s

scrape_configs:

  - job_name: "api-gateway"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["api-gateway:8080"]

  - job_name: "auth-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["auth-service:8081"]

  - job_name: "rider-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["rider-service:8082"]

  - job_name: "driver-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["driver-service:8083"]

  - job_name: "location-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["location-service:8084"]

  - job_name: "trip-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["trip-service:8085"]

  - job_name: "matching-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["matching-service:8086"]

  - job_name: "pricing-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["pricing-service:8087"]

  - job_name: "payment-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["payment-service:8088"]

  - job_name: "eureka-server"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["eureka-server:8761"]