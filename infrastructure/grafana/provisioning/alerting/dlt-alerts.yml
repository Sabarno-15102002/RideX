apiVersion: 1

groups:
  - orgId: 1
    name: RideX DLT alerts
    folder: RideX
    interval: 1m
    rules:
      - uid: ridex-dlt-messages
        title: RideX DLT messages detected
        condition: B
        data:
          - refId: A
            datasourceUid: PBFA97CFB590B2093
            relativeTimeRange:
              from: 300
              to: 0
            model:
              editorMode: code
              expr: |
                sum by (topic) (
                  kafka_topic_partition_current_offset{topic=~".*\\.DLT", topic!~"ridex\\.dlt\\.test\\.DLT"}
                  -
                  kafka_topic_partition_oldest_offset{topic=~".*\\.DLT", topic!~"ridex\\.dlt\\.test\\.DLT"}
                )
              instant: true
              refId: A

          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 300
              to: 0
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer: last
                  type: query
              refId: B

        for: 1m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: "DLT topic {{ $labels.topic }} has retained messages"
          description: "Inspect the DLT topic and replay or resolve the failed event."
        labels:
          severity: warning
          service: kafka
